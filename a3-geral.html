<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ferramentas A3</title>
<style>
  :root {
    --azul:#1f4e79;
    --azul-2:#2b679f;
    --azul-claro:#eaf2fb;
    --fundo:#eef3f8;
    --card:#ffffff;
    --texto:#1f2937;
    --texto-2:#667085;
    --borda:#d7e0ea;
    --sombra:0 10px 30px rgba(31,78,121,.12);
  }

  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    font-family:"Segoe UI", Roboto, Arial, sans-serif;
    background:var(--fundo);
    color:var(--texto);
    min-height:100vh;
    overflow:hidden;
  }

  .app {
    display:grid;
    grid-template-columns:260px minmax(0,1fr);
    height:100vh;
  }

  .sidebar {
    background:linear-gradient(180deg, #173d62 0%, var(--azul) 58%, #295f91 100%);
    color:#fff;
    padding:22px 16px 16px;
    display:flex;
    flex-direction:column;
    gap:20px;
    box-shadow:6px 0 24px rgba(20,55,90,.14);
    z-index:5;
  }

  .brand {
    padding:4px 8px 12px;
    border-bottom:1px solid rgba(255,255,255,.14);
  }
  .brand-badge {
    width:42px;
    height:42px;
    border-radius:12px;
    background:rgba(255,255,255,.15);
    display:grid;
    place-items:center;
    font-weight:800;
    font-size:17px;
    margin-bottom:10px;
    border:1px solid rgba(255,255,255,.18);
  }
  .brand h1 { font-size:19px; line-height:1.15; letter-spacing:.1px; }
  .brand p { margin-top:5px; font-size:12px; opacity:.72; line-height:1.35; }

  .menu { display:flex; flex-direction:column; gap:7px; }
  .menu-label {
    padding:0 10px 4px;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    opacity:.55;
    font-weight:700;
  }
  .menu-btn {
    width:100%;
    border:1px solid transparent;
    color:#e8f0f8;
    background:transparent;
    border-radius:12px;
    padding:11px 12px;
    display:grid;
    grid-template-columns:36px 1fr;
    gap:10px;
    align-items:center;
    cursor:pointer;
    text-align:left;
    transition:.18s ease;
  }
  .menu-btn:hover {
    background:rgba(255,255,255,.10);
    border-color:rgba(255,255,255,.08);
    transform:translateX(2px);
  }
  .menu-btn.ativo {
    background:#fff;
    color:var(--azul);
    box-shadow:0 8px 22px rgba(0,0,0,.14);
  }
  .menu-icon {
    width:34px;
    height:34px;
    border-radius:10px;
    display:grid;
    place-items:center;
    background:rgba(255,255,255,.12);
    font-size:17px;
    font-weight:800;
  }
  .menu-btn.ativo .menu-icon { background:var(--azul-claro); }
  .menu-texto strong { display:block; font-size:13px; line-height:1.2; }
  .menu-texto span { display:block; font-size:10.5px; opacity:.67; margin-top:2px; line-height:1.25; }

  .sidebar-footer {
    margin-top:auto;
    font-size:10.5px;
    opacity:.55;
    padding:8px 10px 0;
    line-height:1.4;
  }

  .conteudo {
    min-width:0;
    display:flex;
    flex-direction:column;
    height:100vh;
  }

  .topbar {
    min-height:76px;
    background:rgba(255,255,255,.94);
    border-bottom:1px solid var(--borda);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:14px 22px;
    box-shadow:0 2px 14px rgba(45,70,95,.06);
    z-index:4;
  }
  .topbar-info { min-width:0; }
  .topbar-info .eyebrow {
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1.15px;
    color:var(--azul-2);
    margin-bottom:3px;
  }
  .topbar-info h2 {
    font-size:20px;
    color:#233549;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .topbar-info p {
    font-size:12px;
    color:var(--texto-2);
    margin-top:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .status {
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:8px;
    background:#f6f9fc;
    border:1px solid var(--borda);
    padding:8px 11px;
    border-radius:999px;
    font-size:11px;
    color:#526173;
    font-weight:600;
  }
  .status-dot {
    width:8px;
    height:8px;
    border-radius:50%;
    background:#29a35a;
    box-shadow:0 0 0 3px rgba(41,163,90,.12);
  }

  .painel-wrap {
    flex:1;
    min-height:0;
    padding:14px;
  }
  .painel {
    position:relative;
    height:100%;
    border-radius:16px;
    overflow:hidden;
    background:#fff;
    border:1px solid #dce4ed;
    box-shadow:var(--sombra);
  }
  .painel iframe {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
    display:none;
    background:#e8eaf0;
  }
  .painel iframe.ativo { display:block; }

  .mobile-top {
    display:none;
    background:linear-gradient(135deg,#173d62,#2a6598);
    color:#fff;
    padding:11px 12px 8px;
  }
  .mobile-brand {
    display:flex;
    align-items:center;
    gap:9px;
    margin-bottom:9px;
  }
  .mobile-brand .logo {
    width:34px;
    height:34px;
    border-radius:10px;
    display:grid;
    place-items:center;
    background:rgba(255,255,255,.14);
    font-size:13px;
    font-weight:800;
  }
  .mobile-brand strong { font-size:14px; display:block; }
  .mobile-brand span { display:block; font-size:10.5px; opacity:.7; margin-top:1px; }
  .mobile-tabs {
    display:flex;
    gap:7px;
    overflow-x:auto;
    scrollbar-width:none;
    padding-bottom:1px;
  }
  .mobile-tabs::-webkit-scrollbar { display:none; }
  .mobile-tab {
    border:0;
    flex-shrink:0;
    padding:8px 12px;
    border-radius:999px;
    font-size:11.5px;
    font-weight:700;
    background:rgba(255,255,255,.12);
    color:#eef5fb;
    cursor:pointer;
  }
  .mobile-tab.ativo { background:#fff; color:var(--azul); }

  @media (max-width: 820px) {
    body { overflow:hidden; }
    .app { display:block; height:100vh; }
    .sidebar, .topbar { display:none; }
    .mobile-top { display:block; height:104px; }
    .conteudo { height:calc(100vh - 104px); }
    .painel-wrap { padding:0; }
    .painel { border-radius:0; border:0; box-shadow:none; }
  }

  @media (max-width: 420px) {
    .mobile-top { height:102px; padding-left:10px; padding-right:10px; }
    .conteudo { height:calc(100vh - 102px); }
    .mobile-tab { padding:8px 11px; font-size:11px; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-badge">A3</div>
      <h1>Ferramentas A3</h1>
      <p>Solução de problemas, gestão e inspeções em um só lugar.</p>
    </div>

    <nav class="menu" id="menuDesktop">
      <div class="menu-label">Ferramentas</div>
    </nav>

    <div class="sidebar-footer">Projeto independente • uso direto no navegador</div>
  </aside>

  <div class="mobile-top">
    <div class="mobile-brand">
      <div class="logo">A3</div>
      <div>
        <strong>Ferramentas A3</strong>
        <span>Gestão, melhoria e segurança</span>
      </div>
    </div>
    <div class="mobile-tabs" id="menuMobile"></div>
  </div>

  <main class="conteudo">
    <header class="topbar">
      <div class="topbar-info">
        <div class="eyebrow">Ferramenta selecionada</div>
        <h2 id="tituloFerramenta">A3 Estratégico</h2>
        <p id="descricaoFerramenta">Visão completa do A3 em uma página.</p>
      </div>
      <div class="status"><span class="status-dot"></span> Pronto para uso</div>
    </header>

    <div class="painel-wrap">
      <section class="painel" id="painel"></section>
    </div>
  </main>
</div>

<script>
  const FERRAMENTAS = [
    {
      nome: 'A3 Estratégico',
      curto: 'Estratégico',
      descricao: 'Visão completa do A3 em uma página.',
      icone: 'A3',
      src: 'a3-estrategico.html'
    },
    {
      nome: 'A3 Passo a Passo',
      curto: 'Passo a Passo',
      descricao: 'Construção guiada em 9 etapas.',
      icone: '➜',
      src: 'a3-passo-a-passo.html'
    },
    {
      nome: 'A3 Celular',
      curto: 'Celular',
      descricao: 'Experiência otimizada para uso em campo.',
      icone: '▣',
      src: 'a3-passo-a-passo-mobile.html'
    },
    {
      nome: 'Inspeção de Segurança',
      curto: 'Inspeção',
      descricao: 'Registro de campo, evidências e geração de PDF.',
      icone: '✓',
      src: 'inspecao-seguranca.html'
    }
  ];

  const CHAVE = 'a3geral_aba';
  const menuDesktop = document.getElementById('menuDesktop');
  const menuMobile = document.getElementById('menuMobile');
  const painel = document.getElementById('painel');
  const tituloFerramenta = document.getElementById('tituloFerramenta');
  const descricaoFerramenta = document.getElementById('descricaoFerramenta');
  const frames = [];
  const botoesDesktop = [];
  const botoesMobile = [];

  let atual = 0;
  try {
    const salvo = parseInt(localStorage.getItem(CHAVE), 10);
    if (!isNaN(salvo) && salvo >= 0 && salvo < FERRAMENTAS.length) atual = salvo;
  } catch (e) {}

  FERRAMENTAS.forEach((f, i) => {
    const btn = document.createElement('button');
    btn.className = 'menu-btn' + (i === atual ? ' ativo' : '');
    btn.innerHTML = `
      <span class="menu-icon">${f.icone}</span>
      <span class="menu-texto">
        <strong>${f.nome}</strong>
        <span>${f.descricao}</span>
      </span>`;
    btn.addEventListener('click', () => selecionar(i));
    menuDesktop.appendChild(btn);
    botoesDesktop.push(btn);

    const btnMob = document.createElement('button');
    btnMob.className = 'mobile-tab' + (i === atual ? ' ativo' : '');
    btnMob.textContent = f.curto;
    btnMob.addEventListener('click', () => selecionar(i));
    menuMobile.appendChild(btnMob);
    botoesMobile.push(btnMob);

    const frame = document.createElement('iframe');
    frame.src = f.src;
    frame.title = f.nome;
    frame.loading = i === atual ? 'eager' : 'lazy';
    frame.className = i === atual ? 'ativo' : '';
    painel.appendChild(frame);
    frames.push(frame);
  });

  function atualizarCabecalho() {
    const f = FERRAMENTAS[atual];
    tituloFerramenta.textContent = f.nome;
    descricaoFerramenta.textContent = f.descricao;
  }

  function selecionar(i) {
    if (i < 0 || i >= FERRAMENTAS.length) return;
    atual = i;
    frames.forEach((fr, k) => fr.classList.toggle('ativo', k === i));
    botoesDesktop.forEach((btn, k) => btn.classList.toggle('ativo', k === i));
    botoesMobile.forEach((btn, k) => btn.classList.toggle('ativo', k === i));
    atualizarCabecalho();
    try { localStorage.setItem(CHAVE, String(i)); } catch (e) {}
  }

  atualizarCabecalho();
</script>
</body>
</html>
